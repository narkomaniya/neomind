<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeoMind Game Starter</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; }
    canvas { border-radius: 12px; background: #171a21; box-shadow: 0 16px 48px rgb(0 0 0 / 45%); }
    p { position: fixed; bottom: 12px; color: #8b93a7; font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="360"></canvas>
  <p>Arrow keys or WASD to move</p>
  <script src="player.js"></script>
  <script src="game.js"></script>
</body>
</html>
