<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoMind</title>
<style>
  :root{
    --bg:#0d0f1a; --side:#121524; --card:#181b2e; --card2:#1e2238;
    --line:#272c45; --text:#eef0ff; --muted:#8d93b8; --dim:#636a90;
    --accent:#8b7cff; --accent2:#5f6cff; --danger:#ff6b81; --ok:#4fe0a6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:#303654;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#3e4568}

  .app{display:flex;height:100vh}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:340px;flex:none;background:var(--side);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px}
  .logo{
    width:38px;height:38px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-weight:800;font-size:19px;
    box-shadow:0 8px 24px rgba(110,100,255,.35);
  }
  .brand h1{margin:0;font-size:17px;letter-spacing:.2px}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:11px}

  .new-btn{
    margin:0 16px 14px;padding:12px 14px;border-radius:12px;text-align:left;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    font-weight:650;box-shadow:0 8px 22px rgba(110,100,255,.28);
    transition:transform .12s,filter .12s;
  }
  .new-btn:hover{filter:brightness(1.1)}
  .new-btn:active{transform:translateY(1px)}

  .search{
    margin:0 16px 12px;display:flex;align-items:center;gap:9px;
    background:#0e1120;border:1px solid var(--line);border-radius:11px;
    padding:0 12px;height:40px;
  }
  .search span{color:var(--dim);font-size:18px}
  .search input{flex:1;background:none;border:0;outline:0;font-size:13px}
  .search input::placeholder{color:var(--dim)}

  .list-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:4px 20px 8px;color:var(--muted);font-size:11px;
    text-transform:uppercase;letter-spacing:1.2px;
  }
  .pill{
    background:#222741;border-radius:20px;padding:2px 8px;
    font-size:10px;letter-spacing:0;color:#b9bff0;
  }
  .list{flex:1;overflow-y:auto;padding:2px 10px 12px}
  .item{
    padding:12px 13px;border-radius:12px;margin-bottom:6px;
    border:1px solid transparent;transition:background .12s,border .12s;
  }
  .item:hover{background:#171b2e}
  .item.active{background:var(--card2);border-color:#3b3f68}
  .item .t{font-weight:600;font-size:13px;margin-bottom:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .p{color:var(--muted);font-size:11px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .d{color:var(--dim);font-size:10px;margin-top:6px}
  .none{color:var(--dim);text-align:center;padding:36px 16px;line-height:1.6;font-size:12px}

  .side-foot{
    border-top:1px solid var(--line);padding:12px 18px;
    display:flex;align-items:center;justify-content:space-between;
    color:var(--dim);font-size:10px;
  }
  .icon-btn{
    width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
    color:var(--muted);font-size:15px;
  }
  .icon-btn:hover{background:#222741;color:var(--text)}

  /* ---------- editor ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;
    background:radial-gradient(1200px 600px at 85% -10%,#20204a 0%,transparent 60%),var(--bg)}
  .topbar{
    height:66px;flex:none;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  }
  .crumb{color:var(--muted);font-size:12px}
  .crumb b{color:var(--text);font-weight:600}
  .badge{
    font-size:10px;color:var(--ok);border:1px solid #215c48;
    background:#10281f;padding:4px 9px;border-radius:20px;
  }
  .editor{flex:1;display:flex;flex-direction:column;padding:26px 32px 20px;min-height:0}
  .editor-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:16px}
  .meta{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px}
  .meta .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .actions{display:flex;gap:9px}
  .btn{padding:9px 16px;border-radius:10px;font-size:12px;font-weight:600;transition:filter .12s}
  .btn:hover{filter:brightness(1.15)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .btn.ghost{background:#20243b;color:var(--muted)}
  .btn.danger{background:#331d2a;color:var(--danger)}
  textarea{
    flex:1;width:100%;resize:none;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:24px 26px;outline:0;line-height:1.75;font-size:15px;
    box-shadow:0 18px 50px rgba(0,0,0,.25);transition:border .15s;
  }
  textarea:focus{border-color:#474d80}
  textarea::placeholder{color:var(--dim)}
  .editor-foot{display:flex;justify-content:space-between;padding-top:12px;
    color:var(--dim);font-size:10px}
  #saveState{color:var(--ok)}

  .empty{flex:1;display:grid;place-items:center;text-align:center;padding:40px}
  .empty .art{
    width:86px;height:86px;border-radius:26px;margin:0 auto 22px;
    background:linear-gradient(135deg,#2a2654,#1b1e38);
    border:1px solid #3a3a68;display:grid;place-items:center;font-size:36px;
    box-shadow:0 20px 60px rgba(90,80,220,.18);
  }
  .empty h2{margin:0 0 8px;font-size:20px}
  .empty p{margin:0 0 22px;color:var(--muted);max-width:340px;line-height:1.6;font-size:13px}
  .empty button{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    padding:11px 20px;border-radius:11px;font-weight:650;font-size:13px;
  }
  .hidden{display:none!important}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
    background:#222741;border:1px solid #3b4168;padding:11px 18px;border-radius:11px;
    font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:10;
    box-shadow:0 12px 32px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:#7a3446;color:#ffc2cd}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">N</div>
      <div><h1>NeoMind</h1><p>мысли под рукой</p></div>
    </div>
    <button id="newBtn" class="new-btn">＋　Новая заметка</button>
    <label class="search"><span>⌕</span><input id="search" placeholder="Поиск по заметкам…"></label>
    <div class="list-head"><span>Заметки</span><span id="count" class="pill">0</span></div>
    <div id="list" class="list"></div>
    <div class="side-foot">
      <span>Rust core · Go GUI</span>
      <button id="openFolder" class="icon-btn" title="Открыть папку данных">📁</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb">NeoMind　/　<b id="crumb">Заметки</b></div>
      <div class="badge">● ядро на Rust</div>
    </div>

    <div id="empty" class="empty">
      <div>
        <div class="art">✎</div>
        <h2>Здесь пока пусто</h2>
        <p>Создай первую заметку — она сохранится в твоём хранилище и всегда будет под рукой.</p>
        <button id="firstBtn">Создать заметку</button>
      </div>
    </div>

    <div id="editor" class="editor hidden">
      <div class="editor-top">
        <div class="meta"><span class="dot"></span><span id="date"></span><span>·</span><span id="chars"></span></div>
        <div class="actions">
          <button id="deleteBtn" class="btn danger">Удалить</button>
          <button id="saveBtn" class="btn primary">Сохранить</button>
        </div>
      </div>
      <textarea id="text" spellcheck="false" placeholder="Пиши сюда…"></textarea>
      <div class="editor-foot">
        <span>Ctrl+S — сохранить　·　Ctrl+N — новая　·　автосохранение</span>
        <span id="saveState"></span>
      </div>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
let notes = [];
let selected = null;
let saveTimer = null;
let toastTimer = null;

const $ = id => document.getElementById(id);
const listEl = $('list'), searchEl = $('search'), textEl = $('text');

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(ms){
  try { return new Date(ms).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return ''; }
}
function titleOf(t){
  const l = String(t||'').trim().split('\n')[0] || 'Без названия';
  return l.length > 52 ? l.slice(0,52)+'…' : l;
}
function previewOf(t){
  const s = String(t||'').replace(/\s+/g,' ').trim();
  return s.length > 76 ? s.slice(0,76)+'…' : s;
}
function toast(msg, bad){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (bad ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className='toast'; }, 2200);
}
function fail(e){ toast('Ошибка: ' + (e && e.message ? e.message : e), true); }

window.onerror = function(m){ document.title = 'JSERR: ' + m; };
async function load(){
  try{
    notes = JSON.parse(await nm_list());
    render();
    if (window.nm_report) nm_report('loaded ' + notes.length);
  }catch(e){ document.title = 'LOADERR: ' + (e && e.message ? e.message : e); fail(e); }
}
function render(){
  const q = searchEl.value.trim().toLowerCase();
  const shown = notes.filter(n => !q || n.text.toLowerCase().includes(q));
  $('count').textContent = notes.length;
  document.title = 'NeoMind' + (notes.length ? ' · ' + notes.length : '');
  if(!shown.length){
    listEl.innerHTML = '<div class="none">' + (q ? 'Ничего не найдено' : 'Заметок пока нет') + '</div>';
    return;
  }
  listEl.innerHTML = shown.map(n => {
    const id = n.id || n.ts;
    const active = id === selected ? ' active' : '';
    return '<div class="item'+active+'" data-id="'+id+'">'+
      '<div class="t">'+esc(titleOf(n.text))+'</div>'+
      '<div class="p">'+esc(previewOf(n.text))+'</div>'+
      '<div class="d">'+esc(fmt(n.created || (n.id>1e12?n.id:n.id*1000)))+'</div></div>';
  }).join('');
  listEl.querySelectorAll('.item').forEach(el=>{
    el.onclick = ()=>select(Number(el.dataset.id));
  });
}
function select(id){
  if(selected === id) return;
  flushSave();
  const n = notes.find(x => (x.id||x.ts) === id);
  if(!n) return;
  selected = id;
  textEl.value = n.text;
  $('date').textContent = fmt(n.created || (n.id>1e12?n.id:n.id*1000));
  $('chars').textContent = n.text.length + ' симв.';
  $('crumb').textContent = titleOf(n.text);
  $('empty').classList.add('hidden');
  $('editor').classList.remove('hidden');
  $('saveState').textContent = '';
  render();
  textEl.focus();
}
function setDirty(){
  $('chars').textContent = textEl.value.length + ' симв.';
  $('saveState').textContent = 'изменения не сохранены';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>save(true), 1200);
}
function flushSave(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; if(selected) save(true); } }
async function save(silent){
  if(selected === null) return;
  clearTimeout(saveTimer); saveTimer = null;
  const text = textEl.value, keep = selected;
  try{
    await nm_update(String(keep), text);
    await load();
    selected = null;
    select(keep);
    $('saveState').textContent = 'сохранено';
    if(!silent) toast('Сохранено');
  }catch(e){ fail(e); }
}
async function create(){
  try{
    const id = Number(await nm_add('Новая заметка'));
    await load();
    selected = null;
    select(id);
    textEl.focus();
    textEl.select();
  }catch(e){ fail(e); }
}
async function remove(){
  if(selected === null) return;
  if(!confirm('Удалить эту заметку?')) return;
  try{
    await nm_delete(String(selected));
    selected = null;
    textEl.value = '';
    $('editor').classList.add('hidden');
    $('empty').classList.remove('hidden');
    await load();
    toast('Заметка удалена');
  }catch(e){ fail(e); }
}

$('newBtn').onclick = create;
$('firstBtn').onclick = create;
$('saveBtn').onclick = ()=>save(false);
$('deleteBtn').onclick = remove;
$('search').oninput = render;
textEl.oninput = setDirty;
$('openFolder').onclick = async ()=>{ try{ await nm_open_folder(); }catch(e){ fail(e); } };
document.onkeydown = e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); save(false); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='n'){ e.preventDefault(); create(); }
  if(e.key==='/' && document.activeElement!==searchEl && document.activeElement!==textEl){
    e.preventDefault(); searchEl.focus();
  }
};

load();
</script>
</body>
</html>
